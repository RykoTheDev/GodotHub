name: Flutter CI

on:
  push:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/i18n/locales/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/i18n/locales/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  RUST_VERSION: '1.99.1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-flutter-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flutter-

      - name: Rust tests for core and bridge
        working-directory: .
        run: cargo test -p godothub_core -p godothub_bridge --locked

      - name: Get Flutter packages
        run: flutter pub get

      - name: Regenerate Flutter locale files from src/i18n/locales
        run: |
          dart run tool/i18n_convert.dart
          dart run slang
          if [ -n "$(git status --porcelain -- lib/i18n)" ]; then
            git status --short -- lib/i18n
            echo "::warning title=Flutter locale files out of date::app/lib/i18n differs from src/i18n/locales. The i18n sync workflow commits the update; this run tests the regenerated files."
          fi

      - name: i18n missing keys and values
        run: dart run tool/i18n/check_keys.dart --check-values

      - name: i18n duplicate keys
        run: dart run tool/i18n/duplicate_keys.dart

      - name: i18n unused keys
        run: dart run tool/i18n/unused_keys.dart

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test

  build:
    if: github.event_name != 'push'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust_targets: ''
            binary: build/windows/x64/runner/Release/godothub-beta.exe
          - os: macos-latest
            target: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: build/macos/Build/Products/Release/GodotHub Beta.app/Contents/MacOS/GodotHub Beta
          - os: ubuntu-latest
            target: linux
            rust_targets: ''
            binary: build/linux/x64/release/bundle/godothub-beta

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_targets }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev xvfb

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-flutter-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flutter-

      - name: Get Flutter packages
        run: flutter pub get

      - name: Regenerate Flutter locale files from src/i18n/locales
        run: |
          dart run tool/i18n_convert.dart
          dart run slang

      - name: Build release
        run: flutter build ${{ matrix.target }} --release

      - name: Command line dispatch through the runner
        run: |
          output="$("${{ matrix.binary }}" --version)"
          echo "$output"
          test "$output" = "godothub-beta 0.1.0"

      - name: Integration test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Integration test
        if: runner.os != 'Linux'
        run: flutter test integration_test -d ${{ matrix.target }}
