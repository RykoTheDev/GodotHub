name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  RUST_VERSION: '1.99.1'

jobs:
  on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tagged commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

  checks:
    needs: on-main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-flutter-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flutter-

      - name: Rust tests for core and bridge
        working-directory: .
        run: cargo test -p godothub_core -p godothub_bridge --locked

      # Steps ending in `|| echo "::warning ..."` report problems without failing the run.
      # Only things that break the app (compile errors, failing behaviour tests,
      # a release build that does not build or run) fail CI.
      - name: Third-party Rust notices are up to date
        working-directory: .
        run: node dev/tool/gen_rust_notices.mjs --check || echo "::warning title=Rust notices out of date::Check failed (non-blocking). See this step's log."

      - name: Get Flutter packages
        run: flutter pub get

      - name: Regenerate Flutter locale files from src/i18n/locales
        run: |
          dart run ../dev/tool/i18n_convert.dart
          dart run slang
          if [ -n "$(git status --porcelain -- lib/i18n)" ]; then
            git status --short -- lib/i18n
            echo "::warning title=Flutter locale files out of date::app/lib/i18n differs from src/i18n/locales. The i18n sync workflow commits the update; this run tests the regenerated files."
          fi

      # Missing translations fall back to English, so these only warn.
      - name: i18n missing keys and values
        run: dart run ../dev/tool/i18n/check_keys.dart --check-values || echo "::warning title=i18n missing keys or values::Check failed (non-blocking). See this step's log."

      - name: i18n duplicate keys
        run: dart run ../dev/tool/i18n/duplicate_keys.dart || echo "::warning title=i18n duplicate keys::Check failed (non-blocking). See this step's log."

      - name: i18n unused keys
        run: dart run ../dev/tool/i18n/unused_keys.dart || echo "::warning title=i18n unused keys::Check failed (non-blocking). See this step's log."

      # Errors fail the run; warnings and infos (lints, deprecations) are reported only.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # The i18next parity test compares the Dart resolver against i18next on the
      # current locale files. Regenerate its fixture so a translation update on a
      # branch is not mistaken for a resolver bug.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate i18next resolution fixture
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun dev/tool/gen_i18n_fixtures.ts
          if [ -n "$(git status --porcelain -- app/test/fixtures/i18next_resolution.json)" ]; then
            echo "::warning title=i18next fixture out of date::app/test/fixtures/i18next_resolution.json was regenerated from src/i18n/locales. Run 'bun dev/tool/gen_i18n_fixtures.ts' and commit it."
          fi

      - name: Widget tests
        run: flutter test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust_targets: ''
            binary: build/windows/x64/runner/Release/godothub-beta.exe
          - os: macos-latest
            target: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            binary: build/macos/Build/Products/Release/GodotHub Beta.app/Contents/MacOS/GodotHub Beta
          - os: ubuntu-latest
            target: linux
            rust_targets: ''
            binary: build/linux/x64/release/bundle/godothub-beta

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_targets }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev xvfb

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-flutter-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flutter-

      - name: Get Flutter packages
        run: flutter pub get

      - name: Regenerate Flutter locale files from src/i18n/locales
        run: |
          dart run ../dev/tool/i18n_convert.dart
          dart run slang

      - name: Build release
        run: flutter build ${{ matrix.target }} --release

      - name: Command line dispatch through the runner
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          output="$("${{ matrix.binary }}" --version)"
          echo "$output"
          test "$output" = "godothub-beta $version"

      # One flutter test run per file. With several files in one run, the
      # desktop app from the first file is still running when the next one
      # starts, and GodotHub's single-instance handoff makes that launch exit
      # at once ("The log reader stopped unexpectedly").
      # Desktop runners sometimes fail to attach the debugger ("Error waiting
      # for a debug connection"), so each file gets one retry; a test that
      # fails twice is a real failure.
      - name: Integration test
        run: |
          run_file() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a flutter test "$1" -d linux
            else
              flutter test "$1" -d ${{ matrix.target }}
            fi
          }
          failed=0
          for file in integration_test/*_test.dart; do
            echo "::group::$file"
            if ! run_file "$file"; then
              echo "::warning title=Integration test retry::$file failed, retrying once"
              run_file "$file" || { echo "::error title=Integration test failed::$file"; failed=1; }
            fi
            echo "::endgroup::"
          done
          exit $failed
