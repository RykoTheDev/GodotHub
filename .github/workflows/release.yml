name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  RUST_VERSION: '1.99.1'
  TAURI_CLI_VERSION: '2.12.3'
  NSIS_URL: 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip'
  NSIS_SHA256: 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
  APPLICATION_ID_URL: 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-plugins-v0/NSIS-ApplicationID.zip'
  APPLICATION_ID_SHA256: '1c2772b0edfb0f96a7524734d6c8fac1fc011f26221faf88f3ed2c950f0c06c0'
  WIX_URL: 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
  WIX_SHA256: '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31'
  APPIMAGETOOL_URL: 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
  APPIMAGETOOL_SHA256: 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
  APPIMAGE_RUNTIME_URL: 'https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64'
  APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not vX.Y.Z" >&2; exit 1; }
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$latest" ]; then
            newest=$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)
            if [ "$newest" != "$version" ] || [ "${latest#v}" = "$version" ]; then
              echo "::error::$version must be higher than the latest release $latest, or installed apps will not update to it" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check the changelog has notes for this release
        run: RELEASE_TAG="$TAG" REPO="$GITHUB_REPOSITORY" node app/packaging/release/notes.mjs > /dev/null

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows
            rust_targets: ''
          - os: macos-latest
            target: macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-22.04
            target: linux
            rust_targets: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_targets }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev zip rpm

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-flutter-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-flutter-

      - name: Read the stable channel definition from the core
        run: |
          set -euo pipefail
          info=$(cargo run -q --locked -p godothub_core --example channel_info -- stable)
          echo "$info"
          {
            echo "CHANNEL_ID=$(jq -r .identifier <<<"$info")"
            echo "CHANNEL_NAME=$(jq -r .display_name <<<"$info")"
            echo "CHANNEL_BIN=$(jq -r .cli_shim_name <<<"$info")"
          } >> "$GITHUB_ENV"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Regenerate Flutter locale files from src/i18n/locales
        working-directory: app
        run: |
          dart run ../dev/tool/i18n_convert.dart
          dart run slang

      - name: Switch the macOS project to the stable channel
        if: runner.os == 'macOS'
        run: bash app/packaging/macos/use_channel.sh stable "$CHANNEL_ID" "$CHANNEL_NAME"

      - name: Build the stable app
        working-directory: app
        run: flutter build ${{ matrix.target }} --release --dart-define=CHANNEL=stable --dart-define=APP_VERSION="$VERSION" --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Check the build has no test switches
        working-directory: app
        run: bash packaging/release/check_test_switches.sh build

      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist tools
          curl -fsSL -o tools/ApplicationID.zip "$APPLICATION_ID_URL"
          echo "$APPLICATION_ID_SHA256  tools/ApplicationID.zip" | sha256sum -c -
          mkdir -p tools/plugin
          unzip -q -o -j tools/ApplicationID.zip ReleaseUnicode/ApplicationID.dll -d tools/plugin
          curl -fsSL -o tools/nsis.zip "$NSIS_URL"
          echo "$NSIS_SHA256  tools/nsis.zip" | sha256sum -c -
          unzip -q -o tools/nsis.zip -d tools
          curl -fsSL -o tools/wix.zip "$WIX_URL"
          echo "$WIX_SHA256  tools/wix.zip" | sha256sum -c -
          unzip -q -o tools/wix.zip -d tools/wix
          MAKENSIS="$PWD/tools/nsis-3.13/makensis.exe" NSIS_PLUGIN_DIR="$PWD/tools/plugin" WIX_DIR="$PWD/tools/wix" \
            bash app/packaging/windows/package.sh stable "$VERSION" app/build/windows/x64/runner/Release dist

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash app/packaging/macos/package.sh \
            "app/build/macos/Build/Products/Release/$CHANNEL_NAME.app" "$VERSION" dist "$CHANNEL_ID" "$CHANNEL_NAME"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p dist tools
          curl -fsSL -o tools/appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  tools/appimagetool" | sha256sum -c -
          curl -fsSL -o tools/runtime-x86_64 "$APPIMAGE_RUNTIME_URL"
          echo "$APPIMAGE_RUNTIME_SHA256  tools/runtime-x86_64" | sha256sum -c -
          chmod +x tools/appimagetool
          bash app/packaging/linux/package.sh stable \
            app/build/linux/x64/release/bundle "$VERSION" dist "$CHANNEL_ID" "$CHANNEL_NAME" "$CHANNEL_BIN" \
            app/packaging/icons/stable/app_icon.png "$PWD/tools/appimagetool" "$PWD/tools/runtime-x86_64"

      - name: Check the glibc floor of the Linux build
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          floor=$(find app/build/linux/x64/release/bundle -type f -exec sh -c 'file -b "$1" | grep -q ELF && objdump -T "$1"' _ {} \; \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n 1)
          echo "The Linux build needs glibc $floor or newer"
          test "$(printf '%s\n2.35\n' "$floor" | sort -V | tail -n 1)" = 2.35

      - name: Sign the update artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set" >&2; exit 1; }
          tauri="npx --yes @tauri-apps/cli@$TAURI_CLI_VERSION"
          shopt -s nullglob
          signed=0
          for artifact in dist/*-setup.exe dist/*-windows-x64-portable.zip dist/*.msi dist/*.app.tar.gz dist/*.AppImage dist/*.deb dist/*.rpm; do
            $tauri signer sign "$artifact"
            test -s "$artifact.sig"
            signed=$((signed + 1))
          done
          case "$RUNNER_OS" in
            Windows) test "$signed" -eq 3 ;;
            macOS) test "$signed" -eq 1 ;;
            Linux) test "$signed" -eq 3 ;;
          esac

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check the asset names
        run: |
          set -euo pipefail
          expected=(
            "GodotHub-$VERSION-windows-x64-setup.exe"
            "GodotHub-$VERSION-windows-x64-setup.exe.sig"
            "GodotHub-$VERSION-windows-x64.msi"
            "GodotHub-$VERSION-windows-x64.msi.sig"
            "GodotHub-$VERSION-windows-x64-portable.zip"
            "GodotHub-$VERSION-windows-x64-portable.zip.sig"
            "GodotHub-$VERSION-darwin-universal.dmg"
            "GodotHub-$VERSION-darwin-universal.app.tar.gz"
            "GodotHub-$VERSION-darwin-universal.app.tar.gz.sig"
            "GodotHub-$VERSION-linux-amd64.AppImage"
            "GodotHub-$VERSION-linux-amd64.AppImage.sig"
            "GodotHub-$VERSION-linux-amd64.deb"
            "GodotHub-$VERSION-linux-amd64.deb.sig"
            "GodotHub-$VERSION-linux-x86_64.rpm"
            "GodotHub-$VERSION-linux-x86_64.rpm.sig"
          )
          actual=$(ls dist | sort)
          wanted=$(printf '%s\n' "${expected[@]}" | sort)
          if [ "$actual" != "$wanted" ]; then
            diff <(echo "$wanted") <(echo "$actual") >&2 || true
            exit 1
          fi

      - name: Write the release notes
        run: |
          set -euo pipefail
          mkdir -p release
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do if [ "$(printf '%s\n%s\n' "${t#v}" "$VERSION" | sort -V | head -n 1)" = "${t#v}" ] && [ "${t#v}" != "$VERSION" ]; then echo "$t"; break; fi; done)
          RELEASE_TAG="$TAG" PREVIOUS_TAG="$previous" node app/packaging/release/notes.mjs > release/notes.md
          cat release/notes.md

      - name: Check every download link matches an uploaded file
        run: RELEASE_TAG="$TAG" node app/packaging/release/check_note_links.mjs release/notes.md dist

      - name: Write latest-v2.json and the frozen latest.json
        run: |
          set -euo pipefail
          NOTES="$(cat release/notes.md)" CHANNEL=stable RELEASE_TAG="$TAG" ASSETS_DIR=dist OUT=release/latest-v2.json \
            node app/packaging/release/latest_json.mjs
          cp .github/updater/legacy-latest.json release/latest.json
          cmp release/latest.json .github/updater/legacy-latest.json
          node -e '
            const m = JSON.parse(require("fs").readFileSync("release/latest-v2.json", "utf8"));
            if (m.version !== process.env.VERSION) throw new Error(`latest-v2.json says ${m.version}, not ${process.env.VERSION}`);
            if (m.notes.includes("## Downloads")) throw new Error("latest-v2.json notes still contain the Downloads section");
          '
          cat release/latest-v2.json

      - name: Upload everything to a draft release
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$REPO" --verify-tag --draft \
            --title "GodotHub $TAG" --notes-file release/notes.md \
            dist/* release/latest-v2.json release/latest.json
