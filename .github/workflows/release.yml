name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'
          - os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run tsc --noEmit

      - name: Generate release notes from changelog
        id: release-notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          export RELEASE_TAGS="$(git ls-remote --tags --refs origin 'v*' 2>/dev/null | sed 's#.*refs/tags/##' || true)"
          BODY=$(node - <<'EOF'
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.REPO;
          const version = tag.replace(/^v/i, '');
          const entries = JSON.parse(fs.readFileSync('src-tauri/changelog.json', 'utf8'));
          const tagOf = (e) => (e.version || '').trim().split(' ')[0];
          const entry = entries.find((e) => tagOf(e) === tag) || entries.find((e) => tagOf(e).startsWith(tag));
          const semver = (v) => {
            const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(v);
            return m ? m.slice(1).map(Number) : null;
          };
          const compare = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
          const current = semver(tag);
          const previous = current
            ? (process.env.RELEASE_TAGS || '')
                .split('\n')
                .map((t) => t.trim())
                .filter((t) => semver(t) && compare(semver(t), current) < 0)
                .sort((a, b) => compare(semver(b), semver(a)))[0]
            : undefined;
          const blocks = [];
          if (entry) {
            blocks.push(`## What's new in ${tag}`);
            const HEADERS = { add: 'New', fix: 'Fixes', improve: 'Improvements' };
            for (const key of ['add', 'fix', 'improve']) {
              const items = (entry.notes || []).filter((n) => n.category === key).map((n) => n.text);
              if (items.length) blocks.push(`### ${HEADERS[key]}\n\n` + items.map((t) => `- ${t}`).join('\n'));
            }
            const known = (entry.known_issues || []).filter(Boolean);
            if (known.length) blocks.push('### Known issues\n\n' + known.map((t) => `- ${t}`).join('\n'));
            blocks.push('---');
          }
          const downloadUrl = (name) =>
            `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(name)}`;
          const rows = [
            ['Windows', 'x64', 'Installer (recommended)', `GodotHub-${version}-windows-x64-setup.exe`],
            ['Windows', 'x64', 'MSI installer', `GodotHub-${version}-windows-x64.msi`],
            ['Windows', 'x64', 'Portable, no install', `GodotHub-${version}-windows-x64-portable.exe`],
            ['macOS', 'Apple Silicon and Intel', 'Disk image', `GodotHub-${version}-darwin-universal.dmg`],
            ['Linux', 'x64', 'AppImage', `GodotHub-${version}-linux-amd64.AppImage`],
            ['Linux', 'x64', 'Debian, Ubuntu (.deb)', `GodotHub-${version}-linux-amd64.deb`],
            ['Linux', 'x64', 'Fedora, openSUSE (.rpm)', `GodotHub-${version}-linux-x86_64.rpm`],
          ];
          blocks.push(
            '## Downloads\n\n' +
              '| Platform | Architecture | Package | Download |\n' +
              '| --- | --- | --- | --- |\n' +
              rows.map(([p, a, k, f]) => `| ${p} | ${a} | ${k} | [${f}](${downloadUrl(f)}) |`).join('\n'),
          );
          blocks.push(
            '**Package managers**\n\n' +
              '- winget: `winget install Ryko.GodotHub`\n' +
              '- Scoop: `scoop bucket add extras` then `scoop install godothub`\n' +
              '- AM (Linux): `am -i godothub`\n\n' +
              'Already using GodotHub? It offers this update in the app.',
          );
          blocks.push(
            '**AppImage not starting on Linux?**\n\n' +
              'The AppImage does not run on every Linux setup. If it fails to start, install it with ' +
              '[AM](https://github.com/ivan-hc/AM) instead. AM downloads the same AppImage from this page, ' +
              'adds GodotHub to your app menu, and updates it with `am -u godothub`.\n\n' +
              '1. Install AM:\n\n' +
              '```bash\n' +
              'wget -q https://raw.githubusercontent.com/ivan-hc/AM/main/AM-INSTALLER && chmod a+x ./AM-INSTALLER && ./AM-INSTALLER && rm ./AM-INSTALLER\n' +
              '```\n\n' +
              '2. Install GodotHub:\n\n' +
              '```bash\n' +
              'am -i godothub\n' +
              '```\n\n' +
              'If you chose AppMan in the AM installer, use `appman -i godothub` instead.',
          );
          if (previous) {
            blocks.push(`**Full changelog:** [${previous}...${tag}](https://github.com/${repo}/compare/${previous}...${tag})`);
          }
          console.log(blocks.join('\n\n'));
          EOF
          )
          {
            echo "body<<GH_RELEASE_NOTES"
            echo "$BODY"
            echo "GH_RELEASE_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release asset names
        id: naming
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Beautified asset names start with v1.4.4. Earlier tags must keep
          # Tauri's default CLI names because already-installed builds of those
          # versions look for them, so the new layout turns itself on only once
          # the tag reaches FIRST_BEAUTIFIED.
          FIRST_BEAUTIFIED="1.4.4"
          older=$(printf '%s\n%s\n' "$FIRST_BEAUTIFIED" "$version" | sort -V | head -n1)
          if [ "$older" = "$FIRST_BEAUTIFIED" ]; then
            pattern='[name]-[version]-[platform]-[arch][setup].[ext]'
            portable="GodotHub-${version}-windows-x64-portable.exe"
          else
            pattern=''
            portable='GodotHub.exe'
          fi
          {
            echo "pattern=$pattern"
            echo "portable=$portable"
          } >> "$GITHUB_OUTPUT"
          echo "asset name pattern: ${pattern:-<tauri default>}"
          echo "portable executable: $portable"

      - name: Build Tauri app & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ steps.naming.outputs.pattern }}
          tagName: ${{ github.ref_name }}
          releaseName: 'GodotHub ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true

      - name: Upload standalone executable (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "src-tauri/target/release/GodotHub.exe" "${{ steps.naming.outputs.portable }}"
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.naming.outputs.portable }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  generate-latest-json:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate latest-v2.json and upload the frozen legacy latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The releases/tags/{tag} endpoint 404s while the release is still a
          # draft, so find the release via the (draft-inclusive) list endpoint.
          release_id=$(gh api --paginate "repos/$REPO/releases" \
            --jq "map(select(.tag_name == \"$TAG\")) | .[0].id // empty")
          if [ -z "$release_id" ]; then
            echo "no release found for tag $TAG" >&2
            exit 1
          fi
          release=$(gh api "repos/$REPO/releases/$release_id")
          gh api --paginate "repos/$REPO/releases/$release_id/assets" > assets.json
          mkdir -p sigs
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/$REPO/releases/assets/$asset_id" > "sigs/$asset_name"
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' assets.json)
          export NOTES="$(printf '%s' "$release" | jq -r '.body // ""')"
          node - <<'EOF'
          const fs = require('fs');
          const TAG = process.env.TAG;
          const REPO = process.env.REPO;
          const NOTES = (process.env.NOTES || '')
            .replace(/(^|\r?\n)(?:---[ \t]*\r?\n(?:[ \t]*\r?\n)*)?## Downloads[\s\S]*$/, '')
            .trimEnd();
          const version = TAG.replace(/^v/i, '');
          const assets = JSON.parse(fs.readFileSync('assets.json', 'utf8'));
          const sigAssets = assets.filter((a) => a.name.endsWith('.sig'));
          if (sigAssets.length === 0) {
            throw new Error('no .sig files found on the release; are updater artifacts enabled?');
          }
          const signatures = new Map();
          for (const a of sigAssets) {
            const artifactName = a.name.slice(0, -'.sig'.length);
            signatures.set(artifactName, fs.readFileSync(`sigs/${a.name}`, 'utf8').trim());
          }
          const taggedUrl = (name) =>
            `https://github.com/${REPO}/releases/download/${TAG}/${encodeURIComponent(name)}`;
          const normArch = (a) => {
            if (['amd64', 'x86_64', 'x64'].includes(a)) return 'x86_64';
            if (['x86', 'i386', 'i686'].includes(a)) return 'i686';
            if (['arm64', 'aarch64'].includes(a)) return 'aarch64';
            if (['arm', 'armv7', 'armhf'].includes(a)) return 'armv7';
            return a;
          };
          const classify = (name) => {
            let m;
            // v1.4.4+ assets carry an explicit platform token, e.g.
            // GodotHub-1.4.4-windows-x64-setup.exe or
            // GodotHub-1.4.4-darwin-universal.app.tar.gz. Older tags keep
            // Tauri's default CLI names, so both shapes are parsed here.
            if ((m = name.match(/-(windows|darwin|macos|linux)-([a-zA-Z0-9_]+)/))) {
              const os = m[1] === 'macos' ? 'darwin' : m[1];
              const arch = normArch(m[2]);
              if (/\.app\.tar\.gz$/.test(name)) return { os, arch, installer: 'app' };
              if (/\.AppImage$/.test(name)) return { os, arch, installer: 'appimage' };
              if (/\.deb$/.test(name)) return { os, arch, installer: 'deb' };
              if (/\.rpm$/.test(name)) return { os, arch, installer: 'rpm' };
              if (/-setup\.exe$/.test(name)) return { os, arch, installer: 'nsis' };
              if (/\.msi$/.test(name)) return { os, arch, installer: 'msi' };
              return null;
            }
            if ((m = name.match(/_([a-zA-Z0-9]+)\.app\.tar\.gz$/)))
              return { os: 'darwin', arch: normArch(m[1]), installer: 'app' };
            if ((m = name.match(/_([a-zA-Z0-9]+)\.AppImage$/)))
              return { os: 'linux', arch: normArch(m[1]), installer: 'appimage' };
            if ((m = name.match(/_([a-zA-Z0-9]+)\.deb$/)))
              return { os: 'linux', arch: normArch(m[1]), installer: 'deb' };
            if ((m = name.match(/\.([a-zA-Z0-9_]+)\.rpm$/)))
              return { os: 'linux', arch: normArch(m[1]), installer: 'rpm' };
            if ((m = name.match(/_([a-zA-Z0-9]+)-setup\.exe$/)))
              return { os: 'windows', arch: normArch(m[1]), installer: 'nsis' };
            if ((m = name.match(/_([a-zA-Z0-9]+)(?:_[a-zA-Z-]+)?\.msi$/)))
              return { os: 'windows', arch: normArch(m[1]), installer: 'msi' };
            return null;
          };
          // Mirrors updaterJsonPreferNsis: the NSIS setup.exe owns the base windows key.
          const preferNsis = true;
          const isPreferredBase = (c) => {
            if (c.os === 'darwin') return c.installer === 'app';
            if (c.os === 'linux') return c.installer === 'appimage';
            if (c.os === 'windows') return preferNsis ? c.installer === 'nsis' : c.installer === 'msi';
            return false;
          };
          const artifacts = [];
          for (const [name, signature] of signatures) {
            const c = classify(name);
            if (!c) {
              // Every .sig on the release is an updater artifact, so failing to
              // recognize one must fail the job instead of silently publishing
              // a latest.json that is missing that platform.
              throw new Error(`unrecognized updater artifact: ${name}`);
            }
            artifacts.push({ name, signature, ...c });
          }
          const hasNativeArm = artifacts.some((a) => a.os === 'darwin' && a.arch === 'aarch64');
          const hasNativeX64 = artifacts.some((a) => a.os === 'darwin' && a.arch === 'x86_64');
          const platforms = {};
          const set = (key, entry) => { platforms[key] = entry; };
          // Deterministic ordering (OS, then installer, then name) so the file
          // looks the same on every runner and matches the old v1.2.5 layout.
          const osOrder = { darwin: 0, linux: 1, windows: 2 };
          const installerOrder = { app: 0, appimage: 1, deb: 2, rpm: 3, nsis: 4, msi: 5 };
          artifacts.sort(
            (a, b) =>
              (osOrder[a.os] ?? 9) - (osOrder[b.os] ?? 9) ||
              (installerOrder[a.installer] ?? 9) - (installerOrder[b.installer] ?? 9) ||
              (a.name < b.name ? -1 : a.name > b.name ? 1 : 0),
          );
          for (const a of artifacts) {
            const entry = { signature: a.signature, url: taggedUrl(a.name) };
            if (isPreferredBase(a)) {
              if (a.os === 'darwin' && a.arch === 'universal') {
                if (!platforms['darwin-aarch64'] || !hasNativeArm) set('darwin-aarch64', entry);
                if (!platforms['darwin-x86_64'] || !hasNativeX64) set('darwin-x86_64', entry);
                set('darwin-universal', entry);
              } else {
                set(`${a.os}-${a.arch}`, entry);
              }
            }
            if (a.os === 'darwin' && a.arch === 'universal') {
              if (!platforms['darwin-aarch64-app'] || !hasNativeArm) set('darwin-aarch64-app', entry);
              if (!platforms['darwin-x86_64-app'] || !hasNativeX64) set('darwin-x86_64-app', entry);
              set('darwin-universal-app', entry);
            } else {
              set(`${a.os}-${a.arch}-${a.installer}`, entry);
            }
          }
          if (Object.keys(platforms).length === 0) {
            throw new Error('could not derive any platform entries from the release signatures');
          }
          const missing = ['windows-x86_64', 'linux-x86_64'].filter((key) => !platforms[key]);
          if (missing.length) {
            throw new Error(`required platforms missing from the release: ${missing.join(', ')}`);
          }
          const manifest = { version, notes: NOTES, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync('latest-v2.json', JSON.stringify(manifest, null, 2));
          console.log(`wrote latest-v2.json with ${Object.keys(platforms).length} platform entries`);
          EOF
          cp .github/updater/legacy-latest.json latest.json
          gh release upload "$TAG" latest-v2.json latest.json --repo "$REPO" --clobber

  publish-to-winget:
    needs: [build, generate-latest-json]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.generate-latest-json.result == 'success' && startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Strip 'v' prefix from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove leading 'v' if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync winget-pkgs fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          FORK_OWNER=$(gh api user --jq .login)
          gh api -X POST "repos/${FORK_OWNER}/winget-pkgs/merge-upstream" \
            -f branch=master

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ryko.GodotHub
          token: ${{ secrets.WINGET_TOKEN }}
          version: ${{ steps.version.outputs.version }}
          installers-regex: '\.msi$'