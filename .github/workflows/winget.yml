name: Publish to WinGet

# release.yml leaves each stable release as a draft. This runs once it is
# published by hand, when its installers are publicly downloadable.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-to-winget:
    runs-on: ubuntu-latest
    # App releases only (vX.Y.Z), never prereleases.
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') }}

    steps:
      - name: Sync winget-pkgs fork
        id: fork
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          FORK_OWNER=$(gh api user --jq .login)
          echo "owner=${FORK_OWNER}" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${FORK_OWNER}/winget-pkgs/merge-upstream" \
            -f branch=master

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ryko.GodotHub
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
          # The fork lives under the token owner's account, not the repo's org
          # (the action's default fork-user is github.repository_owner).
          fork-user: ${{ steps.fork.outputs.owner }}
          release-tag: ${{ github.event.release.tag_name }}
