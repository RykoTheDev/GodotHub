name: Bug Report
description: File a bug report to help us improve.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        Please provide as much detail as possible to help us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or stack traces if available.
      placeholder: Paste error logs or stack traces here...
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Low (Minor annoyance)
        - Medium (Affects functionality but has workaround)
        - High (Major functionality broken)
        - Critical (Crash, data loss, or security issue)
      default: 1
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Version
      description: What version of the software are you using?
      options:
        - 0.5.x
        - 1.0.0
        - 1.1.0
        - 1.1.5
        - 1.2.0
        - 1.2.1
        - 1.2.5
        - 1.3.0
        - 1.3.5
        - 1.3.6
        - 1.3.7
        - 1.3.8
        - 1.3.9
        - 1.4.0
        - 1.4.1
      default: 4
    validations:
      required: true
  - type: checkboxes
    id: usage-method
    attributes:
      label: Installation Method
      description: How did you install the software?
      options:
        - label: "[Windows] Executable (xx.exe)"
        - label: "[Windows] NSIS Setup (xx-setup.exe)"
        - label: "[Windows] MSI Setup (xx.msi)"
        - label: "[Linux] AppImage (xx.AppImage)"
        - label: "[Linux] Debian (xx.deb)"
        - label: "[Linux] RPM (xx.rpm)"
        - label: "[Linux] Snap (xx.snap)"
        - label: "[Linux] Flatpak (xx.flatpak)"
        - label: "[Mac] DMG (xx.dmg)"
        - label: "[Mac] Homebrew (brew install xx)"
        - label: "Built from source"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Provide details about your system environment.
      placeholder: |
        OS: Windows 11 / macOS Sonoma / Ubuntu 22.04
        Architecture: x86_64 / ARM64
        RAM: 16 GB
        GPU: NVIDIA RTX 3060 (if applicable)
        Relevant software versions: ...
    validations:
      required: false
  - type: checkboxes
    id: reproduction
    attributes:
      label: Reproduction Status
      description: Can you consistently reproduce this bug?
      options:
        - label: I can consistently reproduce this issue
        - label: The issue happens intermittently
        - label: The issue only happens under specific conditions (please describe in the Additional Context)
    validations:
      required: true
  - type: checkboxes
    id: regression
    attributes:
      label: Regression Check
      description: Did this work in a previous version?
      options:
        - label: This is a regression (worked in an earlier version)
        - label: This is a new issue (never worked)
        - label: I'm not sure
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots, screen recordings, or log files to help explain your problem.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here. This is also where you can specify "Other" selections from above.
      placeholder: Any other relevant information...
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        **Thank you for reporting this bug!** We'll investigate and get back to you.
