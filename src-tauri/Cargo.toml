[package]
name = "godothub"
version = "1.5.8"
description = "Godot Version and Project Management"
authors = ["Ryko"]
edition = "2021"

[lib]
name = "godothub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
godothub-core = { path = "../crates/godothub-core" }
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1.52.3", features = ["full"] }
tauri-plugin-prevent-default = "5"
tauri-plugin-single-instance = "2.0.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-discord-rpc = { git = "https://github.com/Youwes09/tauri-plugin-discord-rpc", rev = "e0ad152c29b5b8e372e108a7b868707e5f72e1cc" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

