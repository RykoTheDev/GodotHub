[package]
name = "godothub-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "godothub_core"

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
feed-rs = "2"
futures-util = "0.3.32"
notify = "6"
quick-xml = "0.41"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
shlex = "1"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full"] }
trash = "3"
url = "2"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
zip = "9.1.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
